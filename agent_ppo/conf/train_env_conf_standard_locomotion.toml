# -----------------------------------------------------------------------------
# Note: Standard Locomotion: locomotion training on a standard grid of mixed sub-terrains.
# Note: Standard Locomotion:
# -----------------------------------------------------------------------------

# Note: === Basic Configuration ===
# --- ---
[env]
num_envs = 2048
episode_length_s = 25

[env_conf]
seed = 0


# Note: === Terrain Configuration ===
# --- ---
[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = true
max_init_terrain_level = 5

[terrain.standard.pyramid_slope]
proportion = 0.15

[terrain.standard.pyramid_slope_inv]
proportion = 0.2

[terrain.standard.pyramid_stairs]
proportion = 0.25

[terrain.standard.pyramid_stairs_inv]
proportion = 0.3

[terrain.standard.maze]
proportion = 0.1


# Note: === Domain Randomization ===
# --- ---
[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.3, 1.5]
push_robots = true
push_interval_s = 15
max_push_vel_xy = 0.5


# Note: === Input input observation Noise ===
# --- ---
[noise]
add_noise = true


# Note: === Initial State ===
# --- ---
[init_state]
pos = [0.0, 0.0, 0.35]


# Note: === Speed Commands ===
# --- ---
[commands]
resampling_time = [10.0, 10.0]

[commands.limit]
lin_vel_x = [-2.0, 2.0]
lin_vel_y = [-1.5, 1.5]
ang_vel_z = [-1.5, 1.5]

[commands.ranges]
lin_vel_x = [0.2, 0.8]
lin_vel_y = [-0.3, 0.3]
ang_vel_yaw = [-1.0, 1.0]


# ---------------------------------------------------------------------
# Note: Return term Configuration for the retained PPO locomotion baseline.
# ---------------------------------------------------------------------

# Note: --- Positive: speed tracking ---
[rewards.track_lin_vel_xy]
weight = 1.0
[rewards.track_lin_vel_xy.params]
std = 0.25
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 0.5
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

# Note: --- Negative: base stability ---
[rewards.lin_vel_z]
weight = -2.0

[rewards.ang_vel_xy]
weight = -0.08

# Note: --- Negative: joint smoothness ---
[rewards.joint_acc]
weight = -2.5e-7

[rewards.joint_torques]
weight = -1.5e-4

[rewards.dof_pos_limits]
weight = -2.0

# Note: --- Negative: control action smoothness ---
[rewards.action_rate]
weight = -0.01

# Note: --- Negative: undesired contacts ---
[rewards.undesired_contacts]
weight = -1.0
[rewards.undesired_contacts.params]
threshold = 1

# Note: --- Anti-tipping ---
[rewards.flat_orientation]
weight = -1.5

# Note: --- Reach goal (only active in track terrain, returns 0 in standard) ---
[rewards.reach_goal]
weight = 10.0
[rewards.reach_goal.params]
threshold = 0.6
