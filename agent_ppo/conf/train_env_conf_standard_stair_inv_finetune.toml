# Note: === Basic Configuration ===
# Note: === sigma===
[env]
# Note: Number of parallel environments, valid range: [1, 4096].
# Note: 1, 4096
num_envs = 4096

# Note: Max episode duration (seconds).
# Note: sigmaepisode sigmaepisode_length_s = 25

episode_length_s = 25
[env_conf]
# Note: Random seed.
# Note: sigma
seed = 0


# Note: === Terrain Configuration ===
# Note: === sigma===
[terrain]
# Note: Terrain mode, valid values: "standard" | "track".
# Note: "standard" | "track"
mode = "standard"

# Note: In standard mode, num_rows = number of difficulty tiers (curriculum levels along X),
# Note: valid range [1, 10], recommended 10.
# Note: standard sigmanum_rows sigma*sigma*sigmaX sigma, 10]sigma10
# Note: Apply full 10 curriculum tiers again across the standard terrain difficulty band.
# Note: sigma10 sigmastandard sigmanum_rows = 10

# Note: In standard mode, num_cols = parallel plots within the same difficulty tier along Y,
# Note: valid range [1, 40], recommended 20.
# Note: in standard mode num_cols is NOT a difficulty tier, just parallel plots for env distribution.
# Note: standard sigmanum_cols sigma*sigma*sigmaY [1, 40]sigma20
# Note: andard sigmanum_cols sigmaenv sigmanum_cols = 20

# Note: Difficulty range [min, max], valid range: [0.0, 1.0].
# Note: [min, max]sigma.0, 1.0]
# Note: Restore the full standard-mode difficulty band.
# Note: sigmastandard sigmadifficulty_range = [0.0, 1.0]

# Note: Whether to turn on terrain curriculum (promote/demote difficulty by performance).
# Note: sigmasigma# Curriculum stays enabled across the full difficulty band.
# Note: terrain.curriculum also controls the built-in speed range expansion; the
# Note: Python-side agent_ppo.workflow.train_workflow.VelocityStageCurriculum independently
# Note: manages command sampling ranges,
# Note: so enabling terrain.curriculum here only affects terrain difficulty, not commands.
# Note: (Built-in speed expansion is bounded by commands.limit, already correct.)
# Note: sigma[0,1] 10 sigma
# Note: sigmaPython sigmaVelocityCurriculum sigma[velocity_curriculum] sigma
curriculum = true

# Note: Max init difficulty tier for robot placement, valid range: [0, 9].
# Note: [0, 9]
# Note: Retain the initial placement cap at the preset easiest tier unless the user
# Note: explicitly wants to raise it.
# Note: sigmamax_init_terrain_level = 9


# Note: Sub-terrain proportions (all proportions must sum to 1.0).
# Note: Allowed sub-terrains: pyramid_slope | pyramid_slope_inv | pyramid_stairs | pyramid_stairs_inv | maze section
# Note: NOTE: There is NO "flat" terrain type. To simulate flat ground, apply pyramid_slope/inv at difficulty=0.
# Note: sigmaproportion sigma= 1.0sigma# yramid_slope | pyramid_slope_inv | pyramid_stairs | pyramid_stairs_inv | maze section
# Note: sigmasigmasigma= pyramid_slope + max_init_terrain_level=0sigmasigmasigma#
# Note: Phase-0.5: introduce LOW-difficulty stairs while retaining terrain difficulty range unchanged.
# Note: Retain most envs on slopes for gait stability, but add a meaningful fraction of stairs/stairs_inv
# Note: so the robot actually sees step-up and step-down transitions during data collection.
# Note: sigma0.5 sigma# sigmasigma
# Note: sigma[terrain.standard.pyramid_slope]
[terrain.standard.pyramid_slope]
proportion = 0.20

[terrain.standard.pyramid_slope_inv]
proportion = 0.20

[terrain.standard.pyramid_stairs]
proportion = 0.20

[terrain.standard.pyramid_stairs_inv]
proportion = 0.40

[terrain.standard.maze]
proportion = 0.0


# Note: === Domain Randomization ===
# Note: === sigma===
[domain_rand]
# Note: Master switch for domain randomization.
# Note: sigmaenable_domain_rand = true

# Note: Whether to randomize ground friction.
# Note: sigmarandomize_friction = true

# Note: Friction range [min, max], must be >= 0.
# Note: sigma[min, max]sigma>= 0
friction_range = [0.45, 1.4]

# Note: Whether to periodically push the robot.
# Note: sigma# Turned off for phase-1: remove disturbance while robot learns basic gait.
# Note: Turn on after step_score > 10.
# Note: sigmap_score > 10 sigmapush_robots = false

# Note: Push interval (seconds), must be > 0.
# Note: sigma> 0
push_interval_s = 15

# Note: Max push speed in XY plane (m/s), must be >= 0.
# Note: XY sigma(m/s)sigma>= 0
max_push_vel_xy = 0.5


# Note: === Input input observation Noise ===
# Note: === sigma===
[noise]
# Note: Whether to add noise to observations.
# Note: sigma
add_noise = true


# Note: === Initial State ===
# Note: === sigma===
[init_state]
# Note: Robot initial position [x, y, z] (m); z valid range [0.30, 0.60]m, recommended 0.35m.
# Note: sigma[x, y, z] (m)sigma0.30, 0.60]msigma0.35m
pos = [0.0, 0.0, 0.35]


# Note: === Speed Commands ===
# Note: === sigma===
[commands]
# Note: Speed command resampling interval [min, max] (seconds).
# Note: sigma[min, max]sigmaresampling_time = [6.0, 10.0]

[commands.limit]
# Note: Speed command **hard limits** (curriculum may expand sampling range up to here).
# Note: sigma**sigma*urriculum
lin_vel_x = [0.3, 1.3]
lin_vel_y = [-0.2, 0.2]
ang_vel_z = [-0.3, 0.3]

[commands.ranges]
# Note: Speed command **initial sampling ranges** (expand towards limit when curriculum is enabled).
# Note: sigma**sigma*riculum sigmalimitsigma
# Note: Lower bound reverted 0.3sigma.0: requiring min 0.3 m/s made task harder before gait learned.
# Note: Allow zero command so robot can bootstrap on easy terrain.
# Note: Curriculum will naturally expand range once robot walks reliably.
# Note: sigma0.0sigma0.3m/s sigma
lin_vel_x = [0.3, 1.3]
lin_vel_y = [-0.2, 0.2]
ang_vel_yaw = [-0.3, 0.3]


# ---------------------------------------------------------------------
# Note: Return term Configuration
# Note: sigma
# Note: Each return term term must have a numeric `weight`; parameterized rewards apply [rewards.<name>.params].
# Note: sigmaweightsigma[rewards.<name>.params] sigma
# ---------------------------------------------------------------------

# Note: --- Positive: speed tracking ---
# Note: --- sigma---
[rewards.track_lin_vel_xy]
# Note: Slightly reduced 3.0sigma.5: still dominates cost terms, but avoids over-weighting
# Note: pure speed at the expense of gait quality on flat terrain.
weight = 4.0
[rewards.track_lin_vel_xy.params]
std = 0.25
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 1.0
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

# Note: --- Negative: base stability ---
# Note: --- sigma---
[rewards.lin_vel_z]
weight = -1.0

[rewards.ang_vel_xy]
weight = -0.5

# Note: --- Negative: joint smoothness ---
[rewards.joint_acc]
weight = -1.7e-6

[rewards.joint_torques]
weight = -4e-4

[rewards.dof_pos_limits]
weight = -1.3

# Note: --- Negative: control action smoothness ---
[rewards.action_rate]
weight = -0.025

# Note: --- Negative: undesired contacts ---
[rewards.undesired_contacts]
weight = -1.0
[rewards.undesired_contacts.params]
# Note: Max allowed contacts before cost kicks in.
# Note: sigma
threshold = 1

# Note: --- Extra: anti-tipping ---
# Note: --- sigma---
[rewards.flat_orientation]
weight = -2.0
[rewards.reach_goal]
# Note: Reach-goal return term example (active only when env.goal_positions is maintained, i.e. track terrain).
# Note: sigmatrack sigmaenv.goal_positions sigmaweight = 10.0
weight = 10.0
[rewards.reach_goal.params]
threshold = 0.6

# Note: TODO: you can add non-IsaacLab locomotion rewards such as energy /
# Note: correct_base_height / feet_stumble as needed.
# Note: After implementing the corresponding _reward_<name> method in
# Note: agent_ppo/feature/reward_process.py, you can activate it here.
# Note: TODOsigmaenergy / correct_base_height / feet_stumble sigmaIsaacLab sigma# sigmaagent_ppo/feature/reward_process.py sigma_reward_<name> sigma
# Note: sigmasigmasigma
[rewards.action_smoothness]
weight = -0.05
# Note: 2nd-order control action smoothness cost.
# Note: sigma
# Note: Retain a mild 2nd-order smoothness term, but prevent suppressing stair step-up swing.
# Note: sigmaweight = -0.015
[rewards.energy]
weight = -1.2e-4
[rewards.correct_base_height]
weight = -0.6
[rewards.correct_base_height.params]
# Note: Go2 nominal standing height (m).
# Note: Go2 sigma(m)
target_height = 0.38

[rewards.score_guidance]
weight = 0.5
[rewards.score_guidance.params]
command_name = "base_velocity"
min_command = 0.15
tracking_std = 0.35
posture_std = 0.25
power_scale = 35.0
posture_weight = 0.60

# Note: [rewards.hip_to_default] REMOVED sigmacovered by joint_position_penalty.
# Note: hip joints are indices [0,3,6,9] in the 12-DOF joint vector and are already
# Note: included in joint_position_penalty's full L2 norm over all 12 joints.
# Note: Keeping both would double-penalize hip joints while under-constraining knee/ankle,
# Note: skewing the gradient toward hip-only posture at the cost of full-chain naturalness.
# Note: If per-joint weighting is needed in future, implement a weighted L2 in reward_process.py.
# Note: [rewards.hip_to_default] sigmasigmasigmajoint_position_penalty sigma# sigma(sigma0,3,6,9) sigmajoint_position_penalty sigmaL2 sigma# /sigma
# Note: sigmaward_process.py sigma
[rewards.hip_to_default]
# Note: Mild hip regularization to reduce front-leg toe-out and rear-leg toe-in on stairs.
weight = -0.15

[rewards.joint_position_penalty]
# Note: Retain joint-angle regularization, but reduce it for stairs because knees/hips need
# Note: larger deviation from nominal pose during ascent.
# Note: sigmasigmaweight = -0.10
weight = -0.11
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
cmd_threshold = 0.10
ang_cmd_threshold = 0.20

[rewards.stand_still_motion]
# Note: Penalize body bobbing, pitch/rollsigma and repeated leg lifting when the
# Note: command is near zero. This specifically targets the "sigma+ sigma
# Note: failure mode that global gait rewards cannot reliably suppress.
# Note: tch/roll
weight = -0.85
[rewards.stand_still_motion.params]
command_name = "base_velocity"
lin_cmd_threshold = 0.15
ang_cmd_threshold = 0.20
vertical_vel_scale = 0.5
ang_vel_scale = 0.5
joint_vel_scale = 0.1

[rewards.commanded_still_penalty]
weight = -30.0
[rewards.commanded_still_penalty.params]
command_name = "base_velocity"
cmd_threshold = 0.20
still_speed_threshold = 0.12

[rewards.forward_overspeed]
# Note: Moderate bonus for exceeding forward command speed.
weight = 5.0
[rewards.forward_overspeed.params]
command_name = "base_velocity"
min_command = 0.20
max_extra_speed = 0.50
side_error_std = 0.25
yaw_error_std = 0.35
posture_std = 0.35

[rewards.feet_air_time]
# Note: Adjusted: weight 1.0sigma.5, threshold 0.25sigma.18.
# Note: Problem: at slow speeds (0sigma.5 m/s) natural air time is <0.25s, so the
# Note: return term was consistently NEGATIVE (sigma.25/step), acting as a net cost.
# Note: This also created an exploit: one leg stays airborne indefinitely to prevent
# Note: the "air_time < threshold on landing" cost sigmacausing the RR leg circling.
# Note: Lower threshold so slow-speed steps earn positive return term.
# Note: Lower weight to reduce exploit incentive; air_time_variance_penalty handles symmetry.
# Note: sigma.25ssigma# loitsigma# Stair ascent needs longer swing and more decisive foot lift than flat walking.
# Note: Increase the positive signal slightly so policy is less afraid to lift the leg.
weight = 1.0
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.18

[rewards.feet_slide]
# Note: Penalize foot sliding (speed when foot is in contact).
weight = -0.12

[rewards.feet_stumble]
# Note: Penalize feet hitting stair edges / walls (horizontal force >> vertical).
# Note: sigma>> sigma
# Note: Retain this cost, but lower it slightly during stair adaptation so exploratory
# Note: toe contact with the step edge is not over-punished before the policy learns lift.
weight = -0.04

[rewards.termination]
weight = -3.7

# Note: sigmaRound-4 sigma
# Note: Round-4 addition: gait quality constraints

[rewards.dof_vel]
weight = -5.5e-4

[rewards.base_lateral_vel]
weight = -0.7
# Note: NEW Round-4: Penalize *untracked* lateral speed error
# Note: sigma- sigmasigma# sigmalin_vel_y sigmaweight = -0.7
[rewards.air_time_variance_penalty]
weight = -0.55
# Note: Increased -0.3-0.8: primary fix for RR-leg circling
# Note: With feet_air_time weight reduced, variance cost must be the main enforcer
# Note: of 4-leg symmetry. -0.8 is strong enough to prevent any single leg staying
# Note: airborne while others contact sigmadirectly blocks the circling exploit.
# Note: sigma-0.3sigma0.8sigma# feet_air_timesigma# -0.8ploitsigmaweight = -0.55
[rewards.pivot_turning]
# Note: NEW Round-4: Penalize pivoting on spot (low linear vel + high yaw vel with feet on ground).
# Note: sigmasigma# ft & placesigmatrack_ang_vel_z sigmaweight = -0.2
weight = -0.2
[rewards.pivot_turning.params]
lin_vel_threshold = 0.2
ang_vel_threshold = 0.5


# Note: --- Direct pose deviation matches platform pose_score ---
[rewards.pose_deviation]
weight = -1.0

[rewards.feet_clearance]
# Note: Terrain-aware swing-foot clearance return term: directly targets stair-edge tripping.
# Note: Uses local adjacent height-scan deltas instead of full-window max-min to prevent
# Note: overestimating one step when several stair levels appear in the scan window.
weight = 0.31
[rewards.feet_clearance.params]
command_name = "base_velocity"
target_height = 0.08
std = 0.05
terrain_height_scale = 0.60
max_terrain_extra_height = 0.08
speed_height_scale = 0.01
body_y_start = 5
body_y_end = 11
near_x_start = 2
near_x_end = 10
delta_quantile = 0.85

[rewards.feet_swing_forward]
# Note: Encourages swing feet to move forward enough after lifting, reducing rear-foot
# Note: stair-edge trapping on high inverse stairs. Retain low weight to prevent overstriding.
weight = 0.105
[rewards.feet_swing_forward.params]
command_name = "base_velocity"
target_forward = 0.10
std = 0.08
min_command = 0.10

# -----------------------------------------------------------------------------
# Note: Speed Curriculum Configuration
# Note: sigma
# Note: Managed by agent_ppo.workflow.train_workflow.VelocityStageCurriculum, completely independent
# Note: of terrain.curriculum. Expands command sampling ranges stage by stage
# Note: based on mean reward_track_lin_vel_xy performance.
# Note: sigmatrain_workflow.py sigmaVelocityCurriculum sigma# sigmareward_track_lin_vel_xy sigma# =============================================================================
[velocity_curriculum]
# Note: Thresholds now apply tracking ratio in [0,1] instead of absolute weighted return term.
# Note: This prevents curriculum behavior from drifting when return term weight changes.
# Note: sigmatracking 0,1] return term weight sigma# 0.55 means present tracking return term reaches 55% of its theoretical maximum.
promote_threshold = 0.62
promote_count = 3

# Note: Demote when normalized tracking falls below 30% for consecutive checks.
# Note: tracking sigma30% sigmademote_threshold = 0.38
demote_count = 2

# Note: Speed stages: 4 progressive levels.
# Note: Stage 0 must match commands.ranges above (applied at startup, no env.clear needed).
# Note: 4 ge 0 sigmacommands.ranges sigma
[[velocity_curriculum.stages]]
lin_vel_x   = [0.3,  1.3]
lin_vel_y   = [-0.2,  0.2]
ang_vel_yaw = [-0.3, 0.3]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.3,  1.3]
lin_vel_y   = [-0.2,  0.2]
ang_vel_yaw = [-0.3, 0.3]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.3,  1.3]
lin_vel_y   = [-0.2,  0.2]
ang_vel_yaw = [-0.3, 0.3]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.3,  1.3]
lin_vel_y   = [-0.2,  0.2]
ang_vel_yaw = [-0.3, 0.3]
