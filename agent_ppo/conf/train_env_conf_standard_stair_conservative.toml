# -----------------------------------------------------------------------------
# Note: Standard Locomotion sigma Conservative Stair Fine-tune
# Note: Retain slope replay to preserve existing slope ability; focus gradients on stairs.
# -----------------------------------------------------------------------------

# Note: === Basic Configuration ===
# --- ---
[env]
# Note: Number of parallel environments, valid range: [1, 4096].
# Note: [1, 4096]
num_envs = 4096

# Note: Max episode duration (seconds).
# Note: episode
episode_length_s = 25

[env_conf]
# Note: Random seed.
seed = 0


# Note: === Terrain Configuration ===
# --- ---
[terrain]
# Note: Terrain mode, valid values: "standard" | "track".
# Note: "standard" | "track"
mode = "standard"

# Note: In standard mode, num_rows = number of difficulty tiers (curriculum levels along X),
# Note: valid range [1, 10], recommended 10.
# Note: standard num_rows **** X [1, 10] 10
# Note: Stair-specialization phase: keep 10 curriculum tiers but narrow the difficulty
# Note: band so the policy repeatedly sees learnable stair heights.
# Note: 10
num_rows = 10

# Note: In standard mode, num_cols = parallel plots within the same difficulty tier along Y,
# Note: valid range [1, 40], recommended 20.
# Note: in standard mode num_cols is NOT a difficulty tier, just parallel plots for env distribution.
# Note: standard num_cols **** Y [1, 40] 20
# Note: standard num_cols env
num_cols = 20

# Note: Difficulty range [min, max], valid range: [0.0, 1.0].
# Note: [min, max][0.0, 1.0]
# Note: Temporarily narrow the standard-mode difficulty band for stair acquisition.
# Note: standard
difficulty_range = [0.0, 0.85]

# Note: Whether to turn on terrain curriculum (promote/demote difficulty by performance).
# /
# Note: Curriculum stays enabled across the narrowed stair-specialization band.
# Note: terrain.curriculum also controls the built-in speed range expansion; the
# Note: Python-side agent_ppo.workflow.train_workflow.VelocityStageCurriculum independently
# Note: manages command sampling ranges,
# Note: so enabling terrain.curriculum here only affects terrain difficulty, not commands.
# Note: (Built-in speed expansion is bounded by commands.limit, already correct.)
# Note: [0,0.6] 10
# Note: Python VelocityCurriculum [velocity_curriculum]
curriculum = true

# Note: Max init difficulty tier for robot placement, valid range: [0, 9].
# Note: [0, 9]
# Note: Start from the first two easy levels; the previous run already learned steady
# Note: basic walking, so level 1 gives more stair exposure without jumping too far.
# Note: level 1
max_init_terrain_level = 3


# Note: Sub-terrain proportions (all proportions must sum to 1.0).
# Note: Allowed sub-terrains: pyramid_slope | pyramid_slope_inv | pyramid_stairs | pyramid_stairs_inv | maze section
# Note: NOTE: There is NO "flat" terrain type. To simulate flat ground, apply pyramid_slope/inv at difficulty=0.
# Note: proportion = 1.0
# Note: pyramid_slope | pyramid_slope_inv | pyramid_stairs | pyramid_stairs_inv | maze section
# Note: "" = pyramid_slope + max_init_terrain_level=000
# Note: Stair-specialization mix: keep enough slopes to preserve the learned gait, but
# Note: make stairs/stairs_inv the majority so step-up and step-down failures dominate
# Note: the gradient.
# /
[terrain.standard.pyramid_slope]
proportion = 0.15

[terrain.standard.pyramid_slope_inv]
proportion = 0.15

[terrain.standard.pyramid_stairs]
proportion = 0.30

[terrain.standard.pyramid_stairs_inv]
proportion = 0.40

[terrain.standard.maze]
proportion = 0.0


# Note: === Domain Randomization ===
# --- ---
[domain_rand]
# Note: Master switch for domain randomization.
enable_domain_rand = true

# Note: Whether to randomize ground friction.
randomize_friction = true

# Note: Friction range [min, max], must be >= 0.
# Note: [min, max] >= 0
friction_range = [0.5, 1.3]

# Note: Whether to periodically push the robot.
# Note: Turned off for phase-1: remove disturbance while robot learns basic gait.
# Note: Turn on after step_score > 10.
# Note: 1step_score > 10
push_robots = false

# Note: Push interval (seconds), must be > 0.
# Note: > 0
push_interval_s = 15

# Note: Max push speed in XY plane (m/s), must be >= 0.
# Note: XY (m/s) >= 0
max_push_vel_xy = 0.5


# Note: === Input input observation Noise ===
# --- ---
[noise]
# Note: Whether to add noise to observations.
add_noise = true


# Note: === Initial State ===
# --- ---
[init_state]
# Note: Robot initial position [x, y, z] (m); z valid range [0.30, 0.60]m, recommended 0.35m.
# Note: [x, y, z] (m)z [0.30, 0.60]m 0.35m
pos = [0.0, 0.0, 0.35]


# Note: === Speed Commands ===
# --- ---
[commands]
# Note: Speed command resampling interval [min, max] (seconds).
# Note: [min, max]
resampling_time = [6.0, 10.0]

[commands.limit]
# Note: Speed command **hard limits** (curriculum may expand sampling range up to here).
# Note: ****curriculum
lin_vel_x = [-2.0, 2.0]
lin_vel_y = [-1.5, 1.5]
ang_vel_z = [-1.5, 1.5]

[commands.ranges]
# Note: Speed command **initial sampling ranges** (expand towards limit when curriculum is enabled).
# Note: ****curriculum limit

# Note: Lower bound reverted 0.30.0: requiring min 0.3 m/s made task harder before gait learned.
# Note: Allow zero command so robot can bootstrap on easy terrain.
# Note: Curriculum will naturally expand range once robot walks reliably.
# Note: 0.0 0.3m/s
lin_vel_x = [0.0, 0.45]
lin_vel_y = [-0.2, 0.2]
ang_vel_yaw = [-0.8, 0.8]


# ---------------------------------------------------------------------
# Note: Return term Configuration
# Note: Each return term term must have a numeric `weight`; parameterized rewards apply [rewards.<name>.params].
# Note: weight [rewards.<name>.params]
# ---------------------------------------------------------------------

# Note: --- Positive: speed tracking ---
# --- ---
[rewards.track_lin_vel_xy]
# Note: Slightly reduced 3.02.5: still dominates cost terms, but avoids over-weighting
# Note: pure speed at the expense of gait quality on flat terrain.
# Note: 3.02.5
weight = 2.2
[rewards.track_lin_vel_xy.params]
# Note: Std of Gaussian kernel, controls how sharp the error return term decay is.
std = 0.25
# Note: Speed command name.
command_name = "base_velocity"

[rewards.track_ang_vel_z]
# Note: Increased 0.51.5
weight = 1.5
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

# Note: --- Negative: base stability ---
# --- ---
[rewards.lin_vel_z]
# Note: Cost on vertical linear speed.
# Note: Z
# Note: Phase-0 reduction: flat terrain = minimal vertical oscillation; free up gradient budget.
# Note: Phase-0
weight = -0.5

[rewards.ang_vel_xy]
# Note: Cost on pitch/roll angular speed.
# Note: X/Y pitch/roll
# Note: For stairs, some pitch/roll is necessary during step-up. Retain the cost,
# Note: but loosen it from flat-ground shaping strength to prevent over-constraining body motion.
# Note: pitch/roll
weight = -0.30

# Note: --- Negative: joint smoothness ---
# --- ---
[rewards.joint_acc]
# Note: Joint acceleration cost.
# Note: Phase-0: apply reference end value -7.5e-7 (flat terrain = simpler dynamics, can afford tighter)
# Note: Phase-0
weight = -7.5e-7

[rewards.joint_torques]
# Note: Joint torque cost.
weight = -1e-4

[rewards.dof_pos_limits]
# Note: Cost when joints approach position limits.
# Note: Phase-0 reduction: flat terrain = much fewer limit violations; lower weight.
# Note: Phase-0
weight = -0.3

# Note: --- Negative: control action smoothness ---
# --- ---
[rewards.action_rate]
# Note: Delta between consecutive actions (1st order).
# Note: Stairs require more decisive swing-leg control action than flat walking.
# Note: Retain smoothing, but reduce the 1st-order control action cost slightly.
weight = -0.015

# Note: --- Negative: undesired contacts ---
# --- ---
[rewards.undesired_contacts]
# Note: Phase-0 reduction: flat terrain = fewer unexpected body contacts.
# Note: Phase-0
weight = -0.3
[rewards.undesired_contacts.params]
# Note: Max allowed contacts before cost kicks in.
threshold = 1

# Note: --- Extra: anti-tipping ---
# --- ---
[rewards.flat_orientation]
# Note: Cost on deviation from flat base orientation.
# Note: Flat-ground shaping used a very strong upright-body prior. For stairs this becomes
# Note: counter-productive because the robot must pitch its body while climbing.
weight = -1.0

[rewards.reach_goal]
# Note: Reach-goal return term example (active only when env.goal_positions is maintained, i.e. track terrain).
# Note: track env.goal_positions
weight = 10.0
[rewards.reach_goal.params]
threshold = 0.6

# Note: TODO: you can add non-IsaacLab locomotion rewards such as energy /
# Note: correct_base_height / feet_stumble as needed.
# Note: After implementing the corresponding _reward_<name> method in
# Note: agent_ppo/feature/reward_process.py, you can activate it here.
# Note: TODO energy / correct_base_height / feet_stumble IsaacLab
# Note: agent_ppo/feature/reward_process.py _reward_<name>

[rewards.action_smoothness]
# Note: 2nd-order control action smoothness cost.
# Note: Retain a mild 2nd-order smoothness term, but prevent suppressing stair step-up swing.
weight = -0.0075

[rewards.energy]
# Note: Energy cost: torque joint speed.
# Note: energy
weight = -2e-5

[rewards.correct_base_height]
# Note: Penalize deviation of base height from goal.
# Note: posture
# Note: On stairs the base height must vary while stepping up/down, so the flat-ground
# Note: cost is too strict and discourages climbing.
# /
weight = -0.45
[rewards.correct_base_height.params]
# Note: Go2 nominal standing height (m).
# Note: Go2 (m)
target_height = 0.38

# Note: [rewards.hip_to_default] REMOVED covered by joint_position_penalty.
# Note: hip joints are indices [0,3,6,9] in the 12-DOF joint vector and are already
# Note: included in joint_position_penalty's full L2 norm over all 12 joints.
# Note: Keeping both would double-penalize hip joints while under-constraining knee/ankle,
# Note: skewing the gradient toward hip-only posture at the cost of full-chain naturalness.
# Note: If per-joint weighting is needed in future, implement a weighted L2 in reward_process.py.
# Note: [rewards.hip_to_default] joint_position_penalty
# Note: ( 0,3,6,9) joint_position_penalty L2
# /

# Note: reward_process.py
[rewards.joint_position_penalty]
# Note: Retain joint-angle regularization, but reduce it for stairs because knees/hips need
# Note: larger deviation from nominal pose during ascent.
# /
weight = -0.18
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
cmd_threshold = 0.10
ang_cmd_threshold = 0.20

[rewards.stand_still_motion]
# Note: Penalize body bobbing, pitch/roll, and repeated leg lifting when the
# Note: command is near zero. This specifically targets the " + "
# Note: failure mode that global gait rewards cannot reliably suppress.
# Note: pitch/roll
weight = -0.8
[rewards.stand_still_motion.params]
command_name = "base_velocity"
lin_cmd_threshold = 0.15
ang_cmd_threshold = 0.20
vertical_vel_scale = 0.5
ang_vel_scale = 0.5
joint_vel_scale = 0.1

[rewards.feet_air_time]
# Note: Adjusted: weight 1.00.5, threshold 0.250.18.
# Note: Problem: at slow speeds (00.5 m/s) natural air time is <0.25s, so the
# Note: return term was consistently NEGATIVE (0.25/step), acting as a net cost.
# Note: This also created an exploit: one leg stays airborne indefinitely to prevent
# Note: the "air_time < threshold on landing" cost causing the RR leg circling.
# Note: Lower threshold so slow-speed steps earn positive return term.
# Note: Lower weight to reduce exploit incentive; air_time_variance_penalty handles symmetry.
# Note: 0.25s
# Note: exploit
# Note: Stair ascent needs longer swing and more decisive foot lift than flat walking.
# Note: Increase the positive signal slightly so policy is less afraid to lift the leg.
weight = 1.15
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.18

[rewards.feet_slide]
# Note: Penalize foot sliding (speed when foot is in contact).
weight = -0.1

[rewards.feet_stumble]
# Note: Penalize feet hitting stair edges / walls (horizontal force >> vertical).
# Note: >>
# Note: Retain this cost, but lower it slightly during stair adaptation so exploratory
# Note: toe contact with the step edge is not over-punished before the policy learns lift.
weight = -0.035

[rewards.termination]
# Note: Phase-0 increase: -1.0-3.0. On flat terrain the robot SHOULD NOT fall.
# Note: Falls are rare now, so each one is a genuine failure; penalize strongly.
weight = -3.0

# Note: Round-4
# Note: Round-4 addition: gait quality constraints

[rewards.dof_vel]
# Note: NEW Round-4: Penalize large joint velocities (sum of squared joint velocities).
# Note: ""
# Note: Stairs require faster leg swing than flat walking, so loosen this cost.
weight = -3e-4

[rewards.base_lateral_vel]
# Note: NEW Round-4: Penalize *untracked* lateral speed error (actual_vy - cmd_vy).
# - /
# Note: lin_vel_y
weight = -0.5

[rewards.air_time_variance_penalty]
# Note: Increased -0.3-0.8: primary fix for RR-leg circling (asymmetric air time).
# Note: With feet_air_time weight reduced, variance cost must be the main enforcer
# Note: of 4-leg symmetry. -0.8 is strong enough to prevent any single leg staying
# Note: airborne while others contact directly blocks the circling exploit.
# Note: -0.3-0.8
# Note: feet_air_time
# Note: -0.8exploit
weight = -0.6

[rewards.pivot_turning]
# Note: NEW Round-4: Penalize pivoting on spot (low linear vel + high yaw vel with feet on ground).
# Note: +
# Note: lift & place track_ang_vel_z
weight = -0.2
[rewards.pivot_turning.params]
lin_vel_threshold = 0.2
ang_vel_threshold = 0.5


[rewards.feet_clearance]
# Note: Swing-foot clearance return term for stairs: encourages lifting feet over step edges.
# Note: Small weight, only enabled in stair_conservative fine-tune.
weight = 0.35
[rewards.feet_clearance.params]
command_name = "base_velocity"
target_height = 0.11
std = 0.06


# -----------------------------------------------------------------------------
# Note: Speed Curriculum Configuration
# Note: Managed by agent_ppo.workflow.train_workflow.VelocityStageCurriculum, completely independent
# Note: of terrain.curriculum. Expands command sampling ranges stage by stage
# Note: based on mean reward_track_lin_vel_xy performance.
# Note: train_workflow.py VelocityCurriculum
# Note: reward_track_lin_vel_xy
# -----------------------------------------------------------------------------
[velocity_curriculum]
# Note: Thresholds now apply tracking ratio in [0,1] instead of absolute weighted return term.
# Note: This prevents curriculum behavior from drifting when return term weight changes.
# Note: tracking [0,1] return term weight
# Note: 0.62 means present tracking return term reaches 62% of its theoretical maximum.
promote_threshold = 0.68
promote_count = 3

# Note: Demote when normalized tracking falls below 30% for consecutive checks.
# Note: tracking 30%
demote_threshold = 0.45
demote_count = 2

# Note: Speed stages: 4 progressive levels.
# Note: Stage 0 must match commands.ranges above (applied at startup, no env.clear needed).
# Note: 4 Stage 0 commands.ranges
[[velocity_curriculum.stages]]
lin_vel_x   = [0.0,  0.45]
lin_vel_y   = [-0.2,  0.2]
ang_vel_yaw = [-0.8,  0.8]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.0,  0.65]
lin_vel_y   = [-0.25, 0.25]
ang_vel_yaw = [-1.0,  1.0]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.0,  0.9]
lin_vel_y   = [-0.3,  0.3]
ang_vel_yaw = [-1.2,  1.2]
