# =============================================================================
# Standard Fast Locomotion — Speed + Stability + Energy on open terrain.
# Standard 快速步态 — 开放地形上的速度、稳定与能耗优化。
#
# No maze. Focus on jumping/gait quality for faster traversal.
# 无迷宫。专注跳跃/步态质量以实现更快通过。
# =============================================================================

# === Basic Configuration ===
[env]
num_envs = 4096
episode_length_s = 15

[env_conf]
seed = 0


# === Terrain Configuration ===
[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = true
max_init_terrain_level = 9

[terrain.standard.pyramid_slope]
proportion = 0.20

[terrain.standard.pyramid_slope_inv]
proportion = 0.20

[terrain.standard.pyramid_stairs]
proportion = 0.25

[terrain.standard.pyramid_stairs_inv]
proportion = 0.35

# No maze for pure locomotion training
# 纯步态训练，无迷宫
[terrain.standard.maze]
proportion = 0.0


# === Domain Randomization ===
[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.45, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5


# === Observation Noise ===
[noise]
add_noise = true


# === Initial State ===
[init_state]
pos = [0.0, 0.0, 0.35]


# === Velocity Commands: higher speed for fast traversal ===
# === 速度指令：更高速度以实现快速通过 ===
[commands]
resampling_time = [4.0, 7.0]

[commands.limit]
lin_vel_x = [0.0, 1.5]
lin_vel_y = [-0.3, 0.3]
ang_vel_z = [-1.5, 1.5]

[commands.ranges]
lin_vel_x   = [0.0,  1.2]
lin_vel_y   = [-0.2,  0.2]
ang_vel_yaw = [-1.0, 1.0]


# =====================================================================
# Reward Configuration
# =====================================================================

# --- Positive: velocity tracking (primary for speed) ---
[rewards.track_lin_vel_xy]
weight = 2.5
[rewards.track_lin_vel_xy.params]
std = 0.25
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 0.3
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

[rewards.forward_velocity]
weight = 0.40

# --- Jump / gait quality rewards (new for fast locomotion) ---
# --- 跳跃/步态质量奖励（新增，用于快速移动） ---
[rewards.diagonal_air_sync]
weight = 0.8

[rewards.takeoff_velocity]
weight = 0.5
[rewards.takeoff_velocity.params]
threshold = 0.3

[rewards.spring_efficiency]
weight = 0.6
[spring_efficiency.params]
absorb_threshold = 5.0

[rewards.gait_duty_factor]
weight = 0.4
[gait_duty_factor.params]
target_duty = 0.45
std = 0.1

# --- Positive: posture & energy ---
[rewards.posture_stability]
weight = 1.2
[rewards.posture_stability.params]
gravity_std = 0.16
ang_vel_std = 0.43

[rewards.energy_efficiency]
weight = 1.2
[rewards.energy_efficiency.params]
power_scale = 250.0

[rewards.pareto_aligned]
weight = 2.5
[rewards.pareto_aligned.params]
command_name = "base_velocity"
forward_threshold = 0.60
tracking_std = 0.25
posture_weight = 0.5
energy_weight = 0.5
time_weight = 0.0
gravity_std = 0.16
ang_vel_std = 0.43
power_scale = 250.0

# --- Negative: base stability ---
[rewards.lin_vel_z]
weight = -0.52

[rewards.ang_vel_xy]
weight = -0.20

[rewards.ang_acc_xy]
weight = -0.25

[rewards.flat_orientation]
weight = -0.6

[rewards.correct_base_height]
weight = -0.45
[rewards.correct_base_height.params]
target_height = 0.38

# --- Negative: joint smoothness ---
[rewards.joint_acc]
weight = -7.5e-7

[rewards.joint_torques]
weight = -1.05e-4

[rewards.dof_pos_limits]
weight = -0.3

# --- Negative: action smoothness ---
[rewards.action_rate]
weight = -0.016

[rewards.action_smoothness]
weight = -0.011

# --- Negative: undesired contacts ---
[rewards.undesired_contacts]
weight = -0.3
[rewards.undesired_contacts.params]
threshold = 1

# --- Extra ---
[rewards.hip_to_default]
weight = -0.15

[rewards.joint_position_penalty]
weight = -0.11
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
cmd_threshold = 0.10
ang_cmd_threshold = 0.20

[rewards.stand_still_motion]
weight = -0.85
[rewards.stand_still_motion.params]
command_name = "base_velocity"
lin_cmd_threshold = 0.15
ang_cmd_threshold = 0.2
vertical_vel_scale = 0.5
ang_vel_scale = 0.5
joint_vel_scale = 0.1

[rewards.commanded_still_penalty]
weight = -0.19
[rewards.commanded_still_penalty.params]
command_name = "base_velocity"
cmd_threshold = 0.20
still_speed_threshold = 0.12

# --- Gait quality ---
[rewards.feet_air_time]
weight = 1.2
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.18

[rewards.feet_slide]
weight = -0.12

[rewards.feet_stumble]
weight = -0.04

[rewards.termination]
weight = -3.5

[rewards.dof_vel]
weight = -3.9e-4

[rewards.base_lateral_vel]
weight = -0.7

[rewards.air_time_variance_penalty]
weight = -0.55

[rewards.pivot_turning]
weight = -0.2
[pivot_turning.params]
lin_vel_threshold = 0.2
ang_vel_threshold = 0.5

[rewards.feet_clearance]
weight = 0.5
[rewards.feet_clearance.params]
command_name = "base_velocity"
target_height = 0.08
std = 0.05
terrain_height_scale = 0.60
max_terrain_extra_height = 0.08
speed_height_scale = 0.01
body_y_start = 5
body_y_end = 11
near_x_start = 2
near_x_end = 10
delta_quantile = 0.85

[rewards.feet_swing_forward]
weight = 0.15
[rewards.feet_swing_forward.params]
command_name = "base_velocity"
target_forward = 0.10
std = 0.08
min_command = 0.10

# --- Energy ---
[rewards.energy]
weight = -2.0e-5


# =============================================================================
# Velocity Curriculum Configuration
# =============================================================================
[velocity_curriculum]
promote_threshold = 0.62
promote_count = 3
demote_threshold = 0.38
demote_count = 2

[[velocity_curriculum.stages]]
lin_vel_x   = [0.0,  1.2]
lin_vel_y   = [-0.2,  0.2]
ang_vel_yaw = [-1.0, 1.0]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.0,  1.3]
lin_vel_y   = [-0.25,  0.25]
ang_vel_yaw = [-1.2, 1.2]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.0,  1.5]
lin_vel_y   = [-0.3,  0.3]
ang_vel_yaw = [-1.5, 1.5]

[[velocity_curriculum.stages]]
lin_vel_x   = [0.0,  1.5]
lin_vel_y   = [-0.3,  0.3]
ang_vel_yaw = [-1.5, 1.5]
