goal_dist_threshold = 0.8 # 说明：离终点 0.8m 内不强扣，尽量防止终点附近误伤。
maze_goal_dist_gate = 20.0 # 说明：只在maze 段/终点附近启用。
maze_gate_obstacle_threshold = -0.70 # 说明：maze 段门控障碍阈值。

[rewards.wall_proximity] # 说明：靠墙过近扣分。
