# -----------------------------------------------------------------------------
# Pure RL navigation objective.
# 主目标：完成完整 track；辅助目标：头朝前走、朝目标推进。
# 墙体相关奖励只在最后 maze 区域且扫描到连续墙时启用，避免把楼梯当墙绕开。
# -----------------------------------------------------------------------------
[rewards.forward_heading_velocity]
weight = 2.60
[rewards.forward_heading_velocity.params]
target_speed = 2.45
max_reward = 1.20

[rewards.backward_penalty]
weight = -2.5
[rewards.backward_penalty.params]
deadband = 0.03

[rewards.goal_heading_alignment]
weight = 1.0
[rewards.goal_heading_alignment.params]
std = 0.75

[rewards.goal_velocity_projection]
weight = 5.60
[rewards.goal_velocity_projection.params]
max_speed = 2.70

[rewards.goal_backtrack_penalty]
weight = -3.0
[rewards.goal_backtrack_penalty.params]
deadband = 0.02

[rewards.approach_goal]
weight = 12.0

[rewards.goal_distance]
weight = 0.8
[rewards.goal_distance.params]
scale = 8.0

[rewards.reach_goal]
weight = 35.0
[rewards.reach_goal.params]
threshold = 0.6

[rewards.task_complete]
