[rewards.approach_goal] # 说明：接近终点 dense 回报。
weight = 13.0 # 说明：每步间距终点更近都会给回报；导航主信号之一。

[rewards.goal_distance] # 说明：终点间距回报。
weight = 0.55 # 说明：离终点越近越好；辅助 dense 信号。
