min_command = 0.15
tracking_std = 1.00
posture_weight = 0.67
body_y_start = 4
body_y_end = 12
near_x_start = 1
near_x_end = 10
delta_quantile = 0.85
min_delta = 0.025
full_delta = 0.12

[rewards.rough_ang_vel_xy]
weight = -0.060
[rewards.rough_ang_vel_xy.params]
body_y_start = 4
body_y_end = 12
near_x_start = 1
near_x_end = 10
delta_quantile = 0.85
min_delta = 0.025
full_delta = 0.12

[rewards.rough_roll_pitch_abs]
