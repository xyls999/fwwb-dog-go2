[rewards.reach_goal] # 说明：到达终点稀疏回报。
weight = 38.0 # 说明：进入终点半径时给一次较大稀疏回报。
[rewards.reach_goal.params] # 说明：到达终点参数。
threshold = 0.6 # 说明：间距终点 0.6m 内算到达。

[rewards.task_complete] # 说明：完成任务回报。
weight = 190.0 # 说明：完成 Track 的大回报；防止只刷中间 dense 回报不冲终点。
